<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="2515" viewBox="0 0 1000 2515" role="img" aria-labelledby="title desc"><title id="title">Ashad Guide Layout: complete Windows installation in eight steps</title><desc id="desc">Download, save and close Illustrator, extract, run Install-Windows.cmd, confirm YES, wait for Installed, reopen the extension, then dock and create guides. Illustrated instructions, not screenshots.</desc><rect width="1000" height="2515" rx="20" fill="#242424"/><g font-family="Segoe UI,Arial,sans-serif"><text x="35" y="40" fill="#aaa" font-size="18" letter-spacing="2">ASHAD / GUIDE LAYOUT</text><text x="35" y="88" fill="#fff" font-size="38" font-weight="600">Install on Windows — every step</text><text x="35" y="125" fill="#ccc" font-size="23">Illustrator 2026 • Recommended installer method • Version 3.0.2</text><g transform="translate(25 155)"><rect width="950" height="265" rx="13" fill="#303030"/><circle cx="36" cy="36" r="21" fill="#2686df"/><text x="29" y="44" fill="white" font-size="24">1</text><text x="73" y="45" fill="#fff" font-size="29" font-weight="600">Download the Windows ZIP</text><text x="26" y="86" fill="#ddd" font-size="23">On the GitHub page, click</text><text x="26" y="118" fill="#ddd" font-size="23">Download Ashad Guide Layout for Windows.</text><rect x="26" y="135" width="898" height="73" rx="7" fill="#1c1c1c" stroke="#505050"/><text x="44" y="159" fill="#8bc7ff" font-family="Consolas,monospace" font-size="21">↓  Download for Windows</text><text x="44" y="183" fill="#eee" font-family="Consolas,monospace" font-size="21">Ashad-Guide-Layout-Windows-v3.0.2.zip</text><text x="26" y="244" fill="#c9c9c9" font-size="21">Save the complete ZIP to your computer.</text></g><g transform="translate(25 440)"><rect width="950" height="265" rx="13" fill="#303030"/><circle cx="36" cy="36" r="21" fill="#2686df"/><text x="29" y="44" fill="white" font-size="24">2</text><text x="73" y="45" fill="#fff" font-size="29" font-weight="600">Save your work and close Illustrator</text><text x="26" y="86" fill="#ddd" font-size="23">Save every open document.</text><text x="26" y="118" fill="#ddd" font-size="23">Close Illustrator before running the installer.</text><rect x="26" y="135" width="898" height="73" rx="7" fill="#1c1c1c" stroke="#505050"/><text x="44" y="159" fill="#8bc7ff" font-family="Consolas,monospace" font-size="21">Adobe Illustrator</text><text x="44" y="183" fill="#eee" font-family="Consolas,monospace" font-size="21">Save → Close Illustrator</text><text x="26" y="244" fill="#c9c9c9" font-size="21">You will reopen Illustrator after installation finishes.</text></g><g transform="translate(25 725)"><rect width="950" height="265" rx="13" fill="#303030"/><circle cx="36" cy="36" r="21" fill="#2686df"/><text x="29" y="44" fill="white" font-size="24">3</text><text x="73" y="45" fill="#fff" font-size="29" font-weight="600">Extract all the files</text><text x="26" y="86" fill="#ddd" font-size="23">Find the downloaded ZIP in File Explorer.</text><text x="26" y="118" fill="#ddd" font-size="23">Right-click it → Extract All… → Extract.</text><rect x="26" y="135" width="898" height="73" rx="7" fill="#1c1c1c" stroke="#505050"/><text x="44" y="159" fill="#8bc7ff" font-family="Consolas,monospace" font-size="21">Windows ZIP file</text><text x="44" y="183" fill="#eee" font-family="Consolas,monospace" font-size="21">Extract All…    →    Extract</text><text x="26" y="244" fill="#c9c9c9" font-size="21">Open the extracted folder. Do not run files inside the ZIP.</text></g><g transform="translate(25 1010)"><rect width="950" height="265" rx="13" fill="#303030"/><circle cx="36" cy="36" r="21" fill="#2686df"/><text x="29" y="44" fill="white" font-size="24">4</text><text x="73" y="45" fill="#fff" font-size="29" font-weight="600">Run Install-Windows.cmd</text><text x="26" y="86" fill="#ddd" font-size="23">Open the extracted package folder.</text><text x="26" y="118" fill="#ddd" font-size="23">Double-click Install-Windows.cmd.</text><rect x="26" y="135" width="898" height="82" rx="7" fill="#1c1c1c" stroke="#505050"/><text x="44" y="159" fill="#8bc7ff" font-family="Consolas,monospace" font-size="21">Install-Windows.cmd</text><text x="44" y="183" fill="#eee" font-family="Consolas,monospace" font-size="21">Install-Windows.ps1</text><text x="44" y="207" fill="#eee" font-family="Consolas,monospace" font-size="21">com.ashad.guidelayout/</text><text x="26" y="244" fill="#c9c9c9" font-size="21">Keep these files together. Administrator access is normally unnecessary.</text></g><g transform="translate(25 1295)"><rect width="950" height="265" rx="13" fill="#303030"/><circle cx="36" cy="36" r="21" fill="#2686df"/><text x="29" y="44" fill="white" font-size="24">5</text><text x="73" y="45" fill="#fff" font-size="29" font-weight="600">Read the prompt and type YES</text><text x="26" y="86" fill="#ddd" font-size="23">The installer asks permission to install.</text><text x="26" y="118" fill="#ddd" font-size="23">Type YES in capital letters, then press Enter.</text><rect x="26" y="135" width="898" height="73" rx="7" fill="#1c1c1c" stroke="#505050"/><text x="44" y="159" fill="#8bc7ff" font-family="Consolas,monospace" font-size="21">Install and enable this setting?</text><text x="44" y="183" fill="#eee" font-family="Consolas,monospace" font-size="21">&gt; YES    ↵ Enter</text><text x="26" y="244" fill="#c9c9c9" font-size="21">YES enables unsigned CEP 12 panels for your Windows account.</text></g><g transform="translate(25 1580)"><rect width="950" height="265" rx="13" fill="#303030"/><circle cx="36" cy="36" r="21" fill="#2686df"/><text x="29" y="44" fill="white" font-size="24">6</text><text x="73" y="45" fill="#fff" font-size="29" font-weight="600">Wait for Installed</text><text x="26" y="86" fill="#ddd" font-size="23">Wait until the installer reports success.</text><text x="26" y="118" fill="#ddd" font-size="23">If an error appears, use “Need help?” in the README.</text><rect x="26" y="135" width="898" height="73" rx="7" fill="#1c1c1c" stroke="#505050"/><text x="44" y="159" fill="#8edaa5" font-family="Consolas,monospace" font-size="21">Installed.</text><text x="44" y="183" fill="#8edaa5" font-family="Consolas,monospace" font-size="21">Restart Illustrator.</text><text x="26" y="244" fill="#c9c9c9" font-size="21">The installer copies the extension automatically; no folder paste is needed.</text></g><g transform="translate(25 1865)"><rect width="950" height="265" rx="13" fill="#303030"/><circle cx="36" cy="36" r="21" fill="#2686df"/><text x="29" y="44" fill="white" font-size="24">7</text><text x="73" y="45" fill="#fff" font-size="29" font-weight="600">Open the extension in Illustrator</text><text x="26" y="86" fill="#ddd" font-size="23">Start Illustrator again.</text><text x="26" y="118" fill="#ddd" font-size="23">Choose this menu path:</text><rect x="26" y="135" width="898" height="73" rx="7" fill="#1c1c1c" stroke="#505050"/><text x="44" y="159" fill="#8bc7ff" font-family="Consolas,monospace" font-size="21">Window → Extensions</text><text x="44" y="183" fill="#eee" font-family="Consolas,monospace" font-size="21">→ Ashad Guide Layout</text><text x="26" y="244" fill="#c9c9c9" font-size="21">Use the Extensions menu to open the panel.</text></g><g transform="translate(25 2150)"><rect width="950" height="265" rx="13" fill="#303030"/><circle cx="36" cy="36" r="21" fill="#2686df"/><text x="29" y="44" fill="white" font-size="24">8</text><text x="73" y="45" fill="#fff" font-size="29" font-weight="600">Dock the panel and start designing</text><text x="26" y="86" fill="#ddd" font-size="23">Drag the panel tab beside your other panels.</text><text x="26" y="118" fill="#ddd" font-size="23">Open a document, then choose your layout settings.</text><rect x="26" y="135" width="898" height="73" rx="7" fill="#1c1c1c" stroke="#505050"/><text x="44" y="159" fill="#8bc7ff" font-family="Consolas,monospace" font-size="21">Margins  •  Columns  •  Rows</text><text x="44" y="183" fill="#eee" font-family="Consolas,monospace" font-size="21">☑ Preview     →     Create guides</text><text x="26" y="244" fill="#c9c9c9" font-size="21">Turn Preview off before saving or closing your document.</text></g><text x="35" y="2471" fill="#aaa" font-size="19">Illustrated guide; your interface may look different. • © 2026 Ashad</text></g></svg>