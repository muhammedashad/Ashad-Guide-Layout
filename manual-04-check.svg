<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-labelledby="title desc"><title id="title">4. Check the folder structure</title><desc id="desc">The manifest must be directly inside the extension’s CSXS folder: extensions\com.ashad.guidelayout\CSXS\manifest.xml extensions\com.ashad.guidelayout\index.html Avoid an extra com.ashad.guidelayout folder nested inside itself.</desc><rect width="1000" height="310" rx="16" fill="#282828"/><g font-family="Segoe UI,Arial,sans-serif"><circle cx="49" cy="47" r="22" fill="#2686df"/><text x="42" y="55" fill="white" font-size="23">4</text><text x="88" y="57" fill="#f5f5f5" font-size="30" font-weight="600">Check the folder structure</text><text x="28" y="100" fill="#cecece" font-size="21">The manifest must be directly inside the extension’s CSXS folder:</text><rect x="28" y="122" width="944" height="142" rx="9" fill="#1d1d1d" stroke="#515151"/><text x="49" y="158" fill="#8ccaff" font-size="22" font-weight="600">extensions\com.ashad.guidelayout\CSXS\manifest.xml</text><text x="49" y="197" fill="#dedede" font-size="22" >extensions\com.ashad.guidelayout\index.html</text><text x="49" y="236" fill="#dedede" font-size="20" >Avoid an extra com.ashad.guidelayout folder nested inside itself.</text><text x="28" y="292" fill="#aaa" font-size="15">ILLUSTRATED STEP 4 / 6 · WINDOWS · © 2026 ASHAD</text></g></svg>